# Netlify site for ourolayer.com.
#
# MONOREPO: set this site's **Base directory** to `apps/site` in the Netlify UI (Site configuration →
# Build & deploy → Build settings). Netlify then reads THIS file, and `command` / `publish` below stay
# relative to this app. `pnpm install` run from here walks up to the workspace root and installs the
# whole workspace, which is what `@ouro/ds` needs to resolve. The analytics dashboard is a SECOND
# Netlify site off the same repo with its base set to `apps/analytics`.

[build]
  command = "pnpm run build"
  publish = "build/client"

# Personal / fork Netlify: set SITE_URL in the Netlify UI (or here) to your deploy origin for
# canonical URLs, OG, robots, sitemap. Leave unset to follow Netlify's $URL.
[build.environment]
  # SITE_URL = "https://your-site.netlify.app"

  # Origin of ouro-monitor, the indexer /byob and other live pages read. Vite inlines this at
  # BUILD time (vite.config.ts -> __MONITOR_API__), so a deploy is required to change it — and
  # without it those pages render their "monitor not configured" state.
  # Keep CORS_ORIGINS on the monitor's Render service in step with the origins that read it.
  MONITOR_API_URL = "https://ouro-monitor.onrender.com"

# /ledger and /airdrops moved to the analytics site on 2026-09-15 (apps/analytics), keeping their
# paths. Both URLs have been posted and linked for weeks, so they are sent on rather than 404'd. 301
# now that the destination is analytics.ourolayer.com rather than the throwaway Netlify subdomain
# these pointed at until 2026-09-21 — a 301 is cached by browsers more or less forever, which is what
# we want for a permanent address and was exactly why these were 302 before. The trailing-slash form
# is the canonical one on both sites; the bare path is matched too, since that is what a hand-typed
# URL looks like. Keep these in step with site.links.analytics in app/content/site.ts — the app
# cannot read this file and this file cannot read the app.
[[redirects]]
  from = "/ledger"
  to = "https://analytics.ourolayer.com/ledger/"
  status = 301
  force = true

[[redirects]]
  from = "/ledger/*"
  to = "https://analytics.ourolayer.com/ledger/"
  status = 301
  force = true

[[redirects]]
  from = "/airdrops"
  to = "https://analytics.ourolayer.com/airdrops/"
  status = 301
  force = true

[[redirects]]
  from = "/airdrops/*"
  to = "https://analytics.ourolayer.com/airdrops/"
  status = 301
  force = true

# Every route is pre-rendered to its own index.html. Unknown URLs get build/client/404.html
# (written by scripts/postbuild.mjs) with a real 404 status; the app hydrates it and shows its
# own "Page not found". Cache and security headers live in public/_headers.
