<!doctype html>
<meta charset="utf-8">
<title>Ouro OG card</title>
<style>
  @font-face { font-family: "Source Serif 4"; font-weight: 600; src: url("../../public/fonts/source-serif-4-600.woff2") format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; src: url("../../public/fonts/source-serif-4-400-italic.woff2") format("woff2"); }
  @font-face { font-family: "Public Sans"; font-weight: 400 700; src: url("../../public/fonts/public-sans.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 700; src: url("../../public/fonts/jetbrains-mono.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #FAF8F3; color: #1B1710; font-family: "Public Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px; }
  /* The frame is a white sheet on the tinted ground (the site's paper on its one tinted band); it is positioned,
     so the in-flow text needs its own stacking level to paint above it. */
  .frame { position: absolute; inset: 28px; border: 1px solid #E7E1D6; border-radius: 22px; background: #FFFFFF; z-index: 0; }
  .kicker, h1, .sub { position: relative; z-index: 1; }
  .kicker { font-size: 20px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #6A4E19; }
  h1 { margin: 26px 0 0; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 88px; line-height: 1.04; letter-spacing: -0.015em; max-width: 900px; }
  .sub { margin: 28px 0 0; font-size: 28px; line-height: 1.45; color: #5C5447; max-width: 880px; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 64px; display: flex; align-items: flex-end; justify-content: space-between; }
  .wordmark { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 40px; letter-spacing: -0.02em; line-height: 1; }
  .tag { margin-top: 10px; font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-size: 22px; color: #5C5447; }
  .chain { font-family: "JetBrains Mono", monospace; font-size: 18px; color: #756C5E; }
  /* Long titles (three lines at 88px would collide with the footer) step down; see the script below. */
  .card.long h1 { font-size: 68px; }
  .card.long .sub { margin-top: 22px; font-size: 26px; }
  .ring { position: relative; width: 120px; height: 120px; }
  .ring .o { position: absolute; inset: 10px; border: 2px solid #D8D2C6; border-radius: 50%; }
  .ring .d { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #86641F; }
</style>
<div class="card" id="card">
  <div class="frame"></div>
  <div class="kicker" id="k"></div>
  <h1 id="t"></h1>
  <p class="sub" id="s"></p>
  <div class="foot">
    <div>
      <div class="wordmark">Ouro</div>
      <div class="tag" id="tag">Liquidity that pays its holders.</div>
      <div class="chain" style="margin-top:14px">Robinhood Chain · 4663</div>
    </div>
    <div class="ring" aria-hidden="true">
      <div class="o"></div>
      <div class="d" style="top:5px;left:55px"></div>
      <div class="d" style="top:55px;left:105px"></div>
      <div class="d" style="top:105px;left:55px"></div>
      <div class="d" style="top:55px;left:5px"></div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("k").textContent = q.get("k") || "";
  document.getElementById("t").textContent = q.get("t") || "";
  document.getElementById("s").textContent = q.get("s") || "";
  const title = (q.get("t") || "").trim();
  if (title.length > 30) document.getElementById("card").classList.add("long");
  // The home card's title is the tagline itself; don't print it twice.
  const tag = document.getElementById("tag");
  if (title === tag.textContent.trim()) tag.style.display = "none";
</script>
