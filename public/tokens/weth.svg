  <g fill="#1B1710">
    <path d="M32 9 18.5 31.4 32 39.3Z" opacity=".55"/>
    <path d="M32 9 45.5 31.4 32 39.3Z" opacity=".85"/>
    <path d="M32 42 18.5 34.1 32 55Z" opacity=".55"/>
    <path d="M32 42 45.5 34.1 32 55Z" opacity=".85"/>
  </g>
</svg>
